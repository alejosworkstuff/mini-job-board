<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Job Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="title-wrap">
        <h1 class="site-title">Mini Job Board</h1>
        <p class="site-subtitle">Discover modern opportunities and apply faster.</p>
      </div>
      <button id="darkModeBtn" class="theme-toggle" aria-label="Toggle theme">Theme</button>
    </header>

    <main class="page">
      <div class="filters">
        <div class="filters-top">
          <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search jobs..." />
            <button
              id="clearSearch"
              class="clear-search"
              type="button"
              aria-label="Clear search"
              hidden
            >
              ×
            </button>
          </div>
          <button
            id="toggleFilters"
            class="filters-toggle"
            aria-expanded="true"
            aria-controls="filtersPanel"
          >
            Filters
            <span id="activeFiltersBadge" class="filters-badge" hidden>0</span>
          </button>
        </div>

        <div id="filtersPanel" class="filters-panel">
          <select id="typeFilter">
            <option value="all">All</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
            <option value="onsite">Onsite</option>
          </select>

          <select id="seniorityFilter">
            <option value="all">All Levels</option>
            <option value="junior">Junior</option>
            <option value="semi-senior">Semi Senior</option>
            <option value="senior">Senior</option>
            <option value="trainee">Trainee</option>
          </select>

          <select id="sortBy">
            <option value="newest">Newest</option>
            <option value="company-az">Company A-Z</option>
            <option value="remote-first">Remote first</option>
          </select>

          <button id="clearFilters" class="clear-filters">Clear Filters</button>
        </div>

        <div class="results-toolbar">
          <div id="resultsCount" class="results-count">0 jobs found</div>
          <div class="toolbar-right">
            <div class="saved-count" id="savedCount">Saved: 0</div>
            <div class="view-toggle" role="group" aria-label="View mode">
              <button id="viewGridBtn" class="view-btn is-active" type="button" aria-pressed="true">Grid</button>
              <button id="viewListBtn" class="view-btn" type="button" aria-pressed="false">List</button>
            </div>
          </div>
        </div>
      </div>

      <div id="jobs-list" class="jobs-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-illustration">No results found</div>
        <p class="empty-tip">Try clearing filters or searching for a different role.</p>
        <button id="emptyResetBtn" class="empty-reset" type="button">Reset filters</button>
      </div>
      <button id="loadMore" class="load-more" hidden>Load more</button>
    </main>
    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
    
    <div id="jobModal" class="job-modal" hidden>
  <div class="job-modal-backdrop" data-close-modal> </div>

  <div class="job-modal-content" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
    <button type="button" class="job-modal-close" id="closeJobModal" aria-label="Close">×</button>
    <h2 id="jobModalTitle">Job Title</h2>
    <p id="jobModalCompany">Company</p>
    <p id="jobModalMeta">Type • Location • Seniority</p>
    <p id="jobModalDescription">Job description will appear here.</p>

  <a id="jobModalDetailsLink" href="#">Open full details page</a>
  </div>
  </div>

    <script src="app.js" defer></script>


    <footer class="site-footer">
      <div class="footer-inner">
        <a
          class="footer-link portfolio-link"
          href="https://alejosworkstuff.github.io/portfolio/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Portfolio
        </a>
        <a
          class="social-bubble social-github"
          href="https://github.com/alejosworkstuff"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub Profile"
          title="GitHub"
        >
          <img src="./assets/icons/github.svg" alt="" class="social-icon" />
        </a>
        <a
          class="social-bubble social-linkedin"
          href="https://www.linkedin.com/in/alejo-castillo-0b02b73b0/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn Profile"
          title="LinkedIn"
        >
          <img src="./assets/icons/linkedin.svg" alt="" class="social-icon" />
        </a>
      </div>
    </footer>
  </body>
</html>
